input{padding:12px;width:280px;border-radius:8px;border:1px solid #ccc}

<body>
<h2>Access Your Course</h2>
<p>Enter the same email used at payment.</p>
<input type="email" id="email" placeholder="Enter your email"><br><br>
<button id="verifyBtn" onclick="checkEmail()">Check Now</button>
<p id="msg"></p>

<script>
var SHEET_WEBAPP_URL="https://script.google.com/macros/s/AKfycbwtalK3uLH3IUTpozV5tXy-MfEzDvT1rQhpTv9_2M3fP8uclyeBL0WIcIqEXSrBN-2h9Q/exec";
PSAAnalytics.trackEvent('verify_page_viewed',{});
(function(){try{var l=JSON.parse(localStorage.getItem('latestLead')||'{}'); if(l.email) document.getElementById('email').value=l.email;}catch(e){}})();
function setMsg(t,e){var m=document.getElementById('msg'); m.style.color=e?'#b42318':'#157a38'; m.innerText=t;}
function getPaidLocal(email){try{var p=JSON.parse(localStorage.getItem('paidUsers')||'{}'); return p[email]||null;}catch(e){return null;}}
function grant(email,course,source){sessionStorage.setItem('paid','yes');sessionStorage.setItem('paid_email',email);if(course) sessionStorage.setItem('paid_course',course); PSAAnalytics.trackEvent('verify_success',{email:email,source:source}); window.location.href='Excel_success_v3.html?email='+encodeURIComponent(email)+'&course='+encodeURIComponent(course||'Data Analytics Combo');}
function checkFoundText(text){var t=(text||'').trim().toUpperCase(); return t==='FOUND' || t==='TRUE' || t==='YES' || t==='PAID' || t.includes('FOUND');}

function checkEmail(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  if(!email){setMsg('Please enter email.',true); return;}
  var local = getPaidLocal(email);
  if(local && local.paid){ setMsg('Purchase found. Redirecting...',false); grant(email, local.course || 'Data Analytics Combo','local'); return; }

  var btn=document.getElementById('verifyBtn'); btn.disabled=true; setMsg('Checking your purchase...',false);
  var url1=SHEET_WEBAPP_URL+'?action=check&email='+encodeURIComponent(email);
  var url2=SHEET_WEBAPP_URL+'?email='+encodeURIComponent(email);

  fetch(url1).then(r=>r.text()).then(function(t){
    if(checkFoundText(t)){ grant(email,'Data Analytics Combo','sheet'); return; }
    return fetch(url2).then(r=>r.text()).then(function(x){
      if(checkFoundText(x)){ grant(email,'Data Analytics Combo','sheet_legacy'); return; }
      setMsg('Email not found. Please use same payment email or contact support.',true); btn.disabled=false;
      PSAAnalytics.trackEvent('verify_not_found',{email:email,result:(x||'').trim()});
    });
  }).catch(function(){ btn.disabled=false; setMsg('Error checking email. Please try again.',true); PSAAnalytics.trackEvent('verify_error',{}); });
}
</script>
