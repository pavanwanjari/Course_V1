<html>
<head>

<body>

<h1>Excel Complete Combo Course</h1>
<h2>₹999 → ₹1 Only</h2>

<input type="text" id="name" placeholder="Enter Name"><br>

<input type="text" id="mobile" placeholder="Enter Mobile Number"><br>
<input type="text" id="designation" placeholder="Enter Profession"><br>

<button onclick="payNow()">Buy Now for ₹1</button>

<script>
function payNow(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let designation=document.getElementById("designation").value.trim();

if(name==""||email==""||mobile==""||designation==""){
alert("Please fill all details");

}

var options={
"key":"rzp_live_yA31xxMPut8Ech",
"amount":100,
"currency":"INR",
"name":"Professional Skills Academy",
"description":"Excel Combo Course",

"handler": function (response) {

fetch("https://script.google.com/macros/s/AKfycbxUuNU-nhFwGnNcE0iybPE1v81LjihXi479oqhGAnCNfOahXgQxyt30maOWITODA2g2/exec", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:name,
mobile:mobile,
email:email,
profession:designation,
course:"Excel Combo Course",
total:999,
discount:998,
netpayment:1,
payment_id:response.razorpay_payment_id,
order_id:response.razorpay_order_id || "",

})
})
.then(res=>res.text())
.then(data=>{
console.log(data);
})
.catch(err=>{
console.log(err);
})
.finally(()=>{
window.location.href="https://pavanwanjari.github.io/Course-website/Excel_success.html";
});

},

"prefill":{"name":name,"email":email,"contact":mobile},
"theme":{"color":"#28a745"}
};

var rzp=new Razorpay(options);
rzp.open();
}
</script>

</body>
