<!DOCTYPE html>
<html>
<head>
<title>Course Access - DataLearn10X</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="analytics.js"></script>
<style>
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#e8f7ff,#f4f7fc);margin:0;padding:35px 15px;text-align:center}
.box{background:#fff;max-width:560px;margin:auto;padding:30px 24px;border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.12)}
h2{color:#16a34a}.download-btn{display:block;width:290px;max-width:95%;margin:12px auto;padding:12px;border-radius:25px;background:#16a34a;color:#fff;text-decoration:none;font-weight:600}
.download-btn.alt{background:#1d3557}
.note{font-size:13px;color:#666;margin-top:12px}
</style>
</head>
<body>
<a href="index.html" aria-label="DataLearn10X Home" style="position:fixed;top:12px;left:12px;z-index:2000;display:inline-block;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.18)">
  <img src="dl10x.png" alt="DataLearn10X logo" style="height:34px;width:auto;display:block">
</a>

<div class="box">
  <h2>🎉 Access Granted!</h2>
  <p id="courseName">Your course materials are ready.</p>

  <a href="https://drive.google.com/file/d/1_jgHEhCRVnjbwL8l9BIbcH--Nal-D-gn/view?usp=sharing" class="download-btn" target="_blank">📘 Download PDF Notes</a>
  <a href="https://drive.google.com/file/d/1_jgHEhCRVnjbwL8l9BIbcH--Nal-D-gn/view?usp=sharing" class="download-btn" target="_blank">🎥 Watch Video Course</a>
  <a href="https://drive.google.com/file/d/1_jgHEhCRVnjbwL8l9BIbcH--Nal-D-gn/view?usp=sharing" class="download-btn alt" target="_blank">❓ Interview Questions</a>

  <p class="note">If links do not open, contact us on WhatsApp with your payment email.</p>
  <a href="index.html" class="download-btn alt">← Back to Home</a>
</div>

<script>
function q(name){return new URLSearchParams(location.search).get(name)||'';}
var email=(q('email')||sessionStorage.getItem('paid_email')||'').toLowerCase();
var course=q('course')||sessionStorage.getItem('paid_course')||'Data Analytics Combo';
var paid=sessionStorage.getItem('paid')==='yes';
if(!paid && email){
  try{var p=JSON.parse(localStorage.getItem('paidUsers')||'{}'); if(p[email] && p[email].paid){ paid=true; sessionStorage.setItem('paid','yes'); sessionStorage.setItem('paid_email',email); }}catch(e){}
}
if(!paid){ alert('Access denied. Please verify your purchase email.'); location.href='check_email.html'; }
document.getElementById('courseName').innerText='You now have access to: '+course;
PSAAnalytics.trackEvent('course_access_page_viewed',{email:email,course:course});
</script>
</body>
</html>
