<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Access - DataLearn10X</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="analytics.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Poppins',sans-serif;background:linear-gradient(160deg,#fff7ed,#fdf2f8 55%,#eef2ff);text-align:center;min-height:100vh}
header{padding:34px 12px 16px;animation:fade .7s ease both}@keyframes fade{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.logo{width:200px;max-width:80vw;display:block;margin:0 auto}
.box{background:#fff;max-width:560px;margin:10px auto;padding:28px 24px;border-radius:18px;box-shadow:0 14px 36px rgba(45,27,105,.14)}
h2{color:#7c3aed}.download-btn{display:block;width:290px;max-width:95%;margin:12px auto;padding:12px;border-radius:25px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:600}.download-btn.alt{background:#0f172a}.note{font-size:13px;color:#666;margin-top:12px}
</style>
</head>
<body>
<header><a href="index.html"><img class="logo" src="logo_datalearn10x.svg" alt="DataLearn10X"></a></header>
<div class="box">
  <h2>🎉 Access Granted!</h2>
  <p id="courseName">Your course materials are ready.</p>
  <a href="https://drive.google.com/file/d/1_jgHEhCRVnjbwL8l9BIbcH--Nal-D-gn/view?usp=sharing" class="download-btn" target="_blank">📘 Download PDF Notes</a>
  <a href="https://drive.google.com/file/d/1_jgHEhCRVnjbwL8l9BIbcH--Nal-D-gn/view?usp=sharing" class="download-btn" target="_blank">🎥 Watch Video Course</a>
  <a href="https://drive.google.com/file/d/1_jgHEhCRVnjbwL8l9BIbcH--Nal-D-gn/view?usp=sharing" class="download-btn alt" target="_blank">❓ Interview Questions</a>
  <p class="note">If links do not open, contact us on WhatsApp with your payment email.</p>
  <a href="index.html" class="download-btn alt">← Back to Home</a>
</div>
<script>
function q(name){return new URLSearchParams(location.search).get(name)||'';}
var email=(q('email')||sessionStorage.getItem('paid_email')||'').toLowerCase();
var course=q('course')||sessionStorage.getItem('paid_course')||'Data Analytics Combo';
var paid=sessionStorage.getItem('paid')==='yes';
if(!paid && email){try{var p=JSON.parse(localStorage.getItem('paidUsers')||'{}'); if(p[email] && p[email].paid){paid=true;sessionStorage.setItem('paid','yes');sessionStorage.setItem('paid_email',email);}}catch(e){}}
if(!paid){alert('Access denied. Please verify your purchase email.');location.href='check_email.html';}
document.getElementById('courseName').innerText='You now have access to: '+course;PSAAnalytics.trackEvent('course_access_page_viewed',{email:email,course:course});
</script>
</body>
</html>
